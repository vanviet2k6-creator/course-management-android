plugins { id 'com.android.application' }

android {
    namespace 'vn.edu.coursehub'
    compileSdk 35
    defaultConfig {
        applicationId 'vn.edu.coursehub'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        // Can also be set in the app's API settings screen.
        def apiUrl = providers.gradleProperty('MOCK_API_BASE_URL').getOrElse('')
        buildConfigField 'String', 'DEFAULT_BASE_URL', '"' + apiUrl.replace('"', '') + '"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
